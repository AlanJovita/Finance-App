<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="finance_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Financeiro</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <!--
    Remove o service worker que as versões anteriores instalaram.

    O service worker do Flutter serve os assets cache-first e sem revalidar, e
    `flutter_bootstrap.js` é um deles: servido da cópia antiga, ele registrava de
    volta a própria versão antiga do worker, fechando um ciclo em que nenhum
    deploy chegava ao navegador. Foi assim que a fonte de ícones ficou presa duas
    vezes, com os ícones novos saindo em branco.

    O app depende da API para qualquer coisa, então não há o que fazer offline e
    nada se perde desligando-o. Os assets passam a vir do servidor com
    revalidação por ETag, que é o que o `nginx.conf` já configura.

    Este bloco pode sair quando não houver mais navegador com o worker antigo
    instalado — o `index.html` é o único recurso que o worker busca na rede
    primeiro, e é por isso que esta limpeza consegue alcançar quem está preso.
  -->
  <script>
    (async () => {
      if (!('serviceWorker' in navigator)) return;
      try {
        const registros = await navigator.serviceWorker.getRegistrations();
        if (registros.length === 0) return;

        await Promise.all(registros.map((r) => r.unregister()));
        const chaves = await caches.keys();
        await Promise.all(
          chaves.filter((k) => k.startsWith('flutter-')).map((k) => caches.delete(k)),
        );

        // Esta página já foi servida pelo worker antigo: sem recarregar, ela
        // seguiria rodando com os arquivos que acabamos de descartar.
        location.reload();
      } catch (e) {
        console.error('Falha ao remover o service worker antigo:', e);
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
