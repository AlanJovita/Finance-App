server {
    listen 2006;
    listen [::]:2006;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm image/svg+xml;

    # Qualquer caminho desconhecido cai no index.html: o roteamento é do Flutter,
    # inclusive os caminhos de token tratados pelo onGenerateRoute.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sem cache nos arquivos que apontam para a versão atual do build, senão o
    # navegador continua carregando a versão antiga depois de um deploy.
    location ~* ^/(index\.html|flutter_bootstrap\.js|flutter_service_worker\.js|main\.dart\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    location ~* ^/(assets|canvaskit|icons)/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
